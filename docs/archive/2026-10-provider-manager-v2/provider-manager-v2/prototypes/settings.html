<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TokenHUD · 设置中心（交互原型）</title>
<style>
:root{
  --canvas:#F2F4F8; --sidebar:#E8EDF5; --surface:#FFFFFF;
  --ink:#202D43; --muted:#53627A; --accent:#445DAA; --border:#CDD5E3;
  --accent-soft:#EAEEF8; --danger:#A33B3B; --danger-soft:#FBEDED;
  --ok:#2F6B4F; --warn:#8A5A1E; --radius:8px;
  --sp:8px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--canvas); color:var(--ink); font-family:var(--font);
  font-size:13px; line-height:1.5; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:16px; overflow:hidden;
}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
[hidden]{display:none !important}

/* ---- demo banner ---- */
.banner{
  width:min(1100px,100%); flex:0 0 auto; display:flex; align-items:center; gap:8px;
  font-size:12px; color:var(--muted); padding:0 2px;
}
.banner .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 auto}

/* ---- window ---- */
.app{
  width:min(1100px,100%); height:min(760px,calc(100vh - 80px));
  min-height:420px; display:grid; grid-template-columns:240px minmax(0,1fr);
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  overflow:hidden; box-shadow:0 1px 2px rgba(32,45,67,.06);
}

/* ---- sidebar ---- */
.sidebar{
  background:var(--sidebar); border-right:1px solid var(--border);
  display:flex; flex-direction:column; min-height:0; padding:16px 12px 12px;
}
.side-title{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 8px}
.side-title h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.01em}
.side-title .count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.search{position:relative;margin-bottom:8px}
.search input{
  width:100%; height:30px; padding:0 26px 0 28px; border:1px solid var(--border);
  border-radius:6px; background:var(--surface); font-size:13px;
}
.search input::placeholder{color:#7C8AA0}
.search .glass{position:absolute;left:8px;top:7px;width:14px;height:14px;color:var(--muted);pointer-events:none}
.search .clear{position:absolute;right:4px;top:3px;width:22px;height:22px;border:0;background:transparent;color:var(--muted);border-radius:4px;padding:0;line-height:1}
.search .clear:hover{background:#DCE3EF;color:var(--ink)}
.list{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;margin:0 -4px;padding:0 4px}
.group-label{
  font-size:12px; color:var(--muted); margin:12px 4px 4px; display:flex;
  justify-content:space-between; letter-spacing:.02em;
}
.group-label:first-child{margin-top:2px}
.acct{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left;
  border:1px solid transparent; background:transparent; border-radius:6px;
  padding:6px 8px; min-height:34px; margin-bottom:2px;
}
.acct:hover{background:#DDE4F0}
.acct[aria-current="true"]{background:var(--surface); border-color:var(--border); box-shadow:0 1px 1px rgba(32,45,67,.05)}
.acct .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.acct .st{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;flex:0 0 auto}
.st .dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.st.ok .dot{background:var(--ok)} .st.ok{color:var(--ok)}
.st.err .dot{background:var(--danger)} .st.err{color:var(--danger)}
.st.warn .dot{background:var(--warn)} .st.warn{color:var(--warn)}
.side-foot{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--border);margin-top:8px}
.side-foot .btn{flex:1;justify-content:center}
.empty{padding:24px 8px;color:var(--muted);font-size:12px;text-align:center}

/* ---- buttons ---- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:28px; padding:0 12px; border-radius:6px; border:1px solid var(--border);
  background:var(--surface); color:var(--ink); font-size:13px; white-space:nowrap;
}
.btn:hover{background:#F4F6FB; border-color:#B8C3D6}
.btn:active{background:#E9EEF7}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{background:#3A5197; border-color:#3A5197}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:#EDF1F8}
.btn.danger{color:var(--danger); border-color:#DCC3C3}
.btn.danger:hover{background:var(--danger-soft)}
.btn[disabled]{opacity:.45; cursor:not-allowed; pointer-events:none}
.btn.link{border:0;background:transparent;padding:0 2px;min-height:24px;color:var(--accent);text-decoration:underline}
.btn.link:hover{background:transparent}
.icon-btn{
  width:26px;height:26px;padding:0;border:1px solid transparent;border-radius:5px;
  background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;
}
.icon-btn:hover{background:#EDF1F8;color:var(--ink)}

/* ---- main ---- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--canvas)}
.main-head{
  flex:0 0 auto; background:var(--surface); border-bottom:1px solid var(--border);
  padding:16px 20px 0;
}
.head-row{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.head-row h2{font-size:24px;line-height:1.25;margin:0;font-weight:600;letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}
.head-sub{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px;font-size:12px;color:var(--muted)}
.head-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 7px;
  border:1px solid var(--border);border-radius:999px;background:#F7F9FC;color:var(--muted);
}
.badge.lock{background:#F4F6FA}
.tabs{display:flex;gap:4px;margin-top:12px}
.tab{
  border:1px solid transparent;border-bottom:0;background:transparent;color:var(--muted);
  padding:7px 14px;font-size:14px;border-radius:6px 6px 0 0;min-height:36px;
  position:relative;top:1px;
}
.tab:hover{color:var(--ink);background:#F2F5FA}
.tab[aria-selected="true"]{
  background:var(--canvas); color:var(--ink); font-weight:600;
  border-color:var(--border); border-bottom:1px solid var(--canvas);
}
.tab .unsaved{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:2px}
.panel{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:20px}
.panel-inner{max-width:760px}

/* ---- cards / groups ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card h3{font-size:16px;margin:0 0 4px;font-weight:600}
.card .hint{font-size:12px;color:var(--muted);margin:0 0 12px}
.card-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.card-head .grow{flex:1;min-width:0}
.section-label{font-size:12px;color:var(--muted);text-transform:none;letter-spacing:.02em;margin:0 0 8px;font-weight:600}
.rows{border-top:1px solid var(--border)}
.row{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.row .k{flex:0 0 132px;color:var(--muted);font-size:13px}
.row .v{flex:1;min-width:0;font-size:13px;overflow-wrap:anywhere}
.row:last-child{border-bottom:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}

/* ---- quota ---- */
.quota-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}
.quota{border:1px solid var(--border);border-radius:var(--radius);padding:12px;background:var(--surface);min-width:0}
.quota .lbl{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.quota .num{font-size:22px;font-weight:600;margin:6px 0 2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.quota .num small{font-size:12px;font-weight:400;color:var(--muted)}
.quota .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:#E3E8F1;overflow:hidden;margin:10px 0 6px}
.bar > span{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.wide{height:8px}
.quota-note{font-size:12px;color:var(--muted);margin:0}
.result{display:flex;align-items:flex-start;gap:8px;font-size:12px;padding:8px 10px;border-radius:6px;background:#F6F8FC;border:1px solid var(--border);margin-top:8px;overflow-wrap:anywhere}
.result .st{flex:0 0 auto}
.result.err{background:var(--danger-soft);border-color:#E8CECE}
.result.ok{background:#F0F6F2;border-color:#C9DED2}
details.tech{margin-top:12px;border-top:1px solid var(--border);padding-top:8px}
details.tech summary{cursor:pointer;font-size:12px;color:var(--muted);min-height:24px;display:flex;align-items:center;gap:6px}
details.tech summary:hover{color:var(--ink)}
details.tech .rows{margin-top:6px}

/* ---- forms ---- */
.fgroup{border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;background:var(--surface)}
.fgroup > h3{font-size:16px;margin:0 0 2px;font-weight:600}
.fgroup > .hint{font-size:12px;color:var(--muted);margin:0 0 12px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1 / -1}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field label .req{color:var(--danger);margin-left:2px}
.input,select.input,textarea.input{
  height:30px;border:1px solid var(--border);border-radius:6px;background:var(--surface);
  padding:0 8px;min-width:0;width:100%;font-size:13px;
}
textarea.input{height:auto;min-height:56px;padding:6px 8px;resize:vertical}
.input:focus{border-color:var(--accent);outline:2px solid var(--accent-soft);outline-offset:0}
.input[readonly]{background:#F5F7FA;color:var(--muted)}
.input[aria-invalid="true"]{border-color:var(--danger);background:var(--danger-soft)}
.field .err{font-size:12px;color:var(--danger);min-height:0}
.field .note{font-size:12px;color:var(--muted)}
.inline{display:flex;gap:8px;align-items:center;min-width:0}
.inline .input{flex:1}
.check{display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:4px 0}
.check input{margin:3px 0 0;flex:0 0 auto}
.check .sub{display:block;font-size:12px;color:var(--muted)}
.alert{display:flex;gap:8px;align-items:flex-start;border:1px solid #E8CECE;background:var(--danger-soft);color:var(--danger);border-radius:6px;padding:8px 10px;font-size:12px;margin-bottom:12px;overflow-wrap:anywhere}
.alert.info{border-color:var(--border);background:#F4F7FC;color:var(--muted)}
.alert strong{font-weight:600}

.editbar{
  position:sticky;bottom:0;z-index:3;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:12px 0 4px;margin-top:8px;background:linear-gradient(to top,var(--canvas) 72%,rgba(242,244,248,0));
}
.editbar .status{font-size:12px;color:var(--muted);margin-right:auto}
.editbar .btn{min-height:30px}

/* ---- template catalog ---- */
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.tpl{
  text-align:left;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);
  padding:12px;display:flex;flex-direction:column;gap:4px;min-height:88px;
}
.tpl:hover{border-color:var(--accent);background:#F8FAFE}
.tpl .t{font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.tpl .d{font-size:12px;color:var(--muted)}
.tpl .tag{font-size:11px;border:1px solid var(--border);border-radius:999px;padding:0 6px;color:var(--muted);background:#F7F9FC;flex:0 0 auto}
.tpl[disabled]{opacity:.6;cursor:not-allowed}
.tpl[disabled]:hover{border-color:var(--border);background:var(--surface)}

/* ---- schedule ---- */
.time-list{display:flex;flex-direction:column;gap:8px}
.time-row{display:flex;gap:8px;align-items:flex-start}
.time-row .field{flex:0 0 120px}
.time-row .field .input{width:120px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:2px 4px 2px 10px;font-size:12px;background:#F7F9FC;font-variant-numeric:tabular-nums}
.chip button{border:0;background:transparent;color:var(--muted);width:20px;height:20px;border-radius:50%;line-height:1;padding:0}
.chip button:hover{background:#DCE3EF;color:var(--ink)}
.unsupported{border:1px dashed var(--border);border-radius:var(--radius);padding:14px;background:#F7F9FC;font-size:13px;color:var(--muted)}
.unsupported strong{color:var(--ink);display:block;font-size:14px;margin-bottom:4px}

/* ---- modal / sheet ---- */
.overlay{
  position:fixed;inset:0;background:rgba(32,45,67,.28);display:flex;align-items:center;
  justify-content:center;padding:16px;z-index:50;
}
.sheet{
  width:min(720px,100%);max-height:calc(100vh - 32px);background:var(--surface);
  border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;
  overflow:hidden;box-shadow:0 16px 40px rgba(32,45,67,.22);
}
.sheet-head{display:flex;align-items:flex-start;gap:12px;padding:16px 20px 8px;border-bottom:1px solid var(--border)}
.sheet-head h2{font-size:16px;margin:0;font-weight:600}
.sheet-head p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.sheet-body{padding:16px 20px;overflow-y:auto;min-height:0}
.sheet-foot{display:flex;gap:8px;align-items:center;padding:12px 20px;border-top:1px solid var(--border);background:#FAFBFD;flex-wrap:wrap}
.sheet-foot .status{font-size:12px;color:var(--muted);margin-right:auto}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.seg button{
  border:1px solid var(--border);background:var(--surface);border-radius:999px;
  padding:0 12px;min-height:28px;font-size:12px;color:var(--muted);
}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.scan-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.scan-table th{text-align:left;font-weight:500;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--border);font-size:12px}
.scan-table td{padding:7px 4px;border-bottom:1px solid var(--border);vertical-align:top;overflow-wrap:anywhere}
.scan-table tr:last-child td{border-bottom:0}
.scan-table .ck{width:26px}
.scan-table .st-col{width:96px}
.scan-table .why{color:var(--danger)}
.scan-table tr.done td{color:var(--muted)}
.scan-table tr.done .nm{text-decoration:line-through}
.source-box{border:1px solid var(--border);border-radius:6px;background:#F5F7FA;padding:8px 10px;font-size:12px;color:var(--muted);margin-top:12px;display:flex;gap:12px;flex-wrap:wrap}
.source-box .mono{color:var(--ink)}

/* ---- confirm dialog ---- */
.dialog{width:min(420px,100%);background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 16px 40px rgba(32,45,67,.22);overflow:hidden}
.dialog h2{font-size:16px;margin:0;padding:16px 20px 4px}
.dialog p{margin:0;padding:0 20px 14px;font-size:13px;color:var(--muted)}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--border);background:#FAFBFD;flex-wrap:wrap}

/* ---- toast ---- */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;
  background:var(--ink);color:#fff;font-size:13px;padding:8px 14px;border-radius:6px;
  max-width:min(520px,calc(100vw - 32px));box-shadow:0 6px 20px rgba(32,45,67,.24);
}
.toast.err{background:var(--danger)}

/* ---- responsive ---- */
@media (max-width:1000px){
  .quota-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .quota-grid .quota:last-child{grid-column:1 / -1}
}
@media (max-width:980px){
  .app{grid-template-columns:212px minmax(0,1fr)}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .row .k{flex-basis:108px}
  .panel{padding:16px}
  .main-head{padding:14px 16px 0}
  .head-row h2{font-size:22px}
}
@media (max-width:820px){
  .quota-grid{grid-template-columns:minmax(0,1fr)}
  .quota-grid .quota:last-child{grid-column:auto}
  .sidebar{padding:12px 8px 8px}
  .side-foot{flex-direction:column}
}
@media (max-height:680px){
  .app{height:calc(100vh - 64px)}
  .banner{font-size:11px}
  .main-head{padding-top:12px}
  .panel{padding-top:14px}
}
@media (prefers-reduced-motion: no-preference){
  .btn,.tab,.acct,.tpl,.icon-btn{transition:background-color .12s ease,border-color .12s ease,color .12s ease}
  .bar > span{transition:width .25s ease}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important;scroll-behavior:auto !important}
}
</style>
</head>
<body>
<div class="banner" role="note">
  <span class="dot" aria-hidden="true"></span>
  <span>交互原型 · 演示数据 · 不连接真实服务 · 保存仅存于本页，刷新即恢复演示数据</span>
</div>

<div class="app" id="app">
  <aside class="sidebar" aria-label="账号源列表">
    <div class="side-title">
      <h1>账号</h1>
      <span class="count" id="acctCount">0 个</span>
    </div>
    <div class="search">
      <svg class="glass" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <input id="searchInput" type="search" placeholder="搜索账号或供应商" aria-label="搜索账号或供应商" autocomplete="off">
      <button class="clear" id="searchClear" type="button" aria-label="清除搜索" hidden>×</button>
    </div>
    <div class="list" id="acctList" role="listbox" aria-label="账号"></div>
    <div class="side-foot">
      <button class="btn" id="btnNew" type="button">添加账号</button>
      <button class="btn" id="btnImport" type="button">导入…</button>
    </div>
  </aside>

  <main class="main" aria-label="账号详情">
    <header class="main-head">
      <div class="head-row">
        <div style="min-width:0;flex:1">
          <h2 id="detailTitle">—</h2>
          <div class="head-sub" id="detailSub"></div>
        </div>
        <div class="head-actions" id="detailActions"></div>
      </div>
      <div class="tabs" role="tablist" aria-label="账号视图" id="tabList"></div>
    </header>
    <div class="panel" id="panel" role="tabpanel" tabindex="-1"></div>
  </main>
</div>

<div class="overlay" id="importOverlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="importTitle">
    <div class="sheet-head">
      <div style="flex:1;min-width:0">
        <h2 id="importTitle">导入账号</h2>
        <p id="importSub">从其他工具扫描已有配置。演示环境仅读取模拟数据。</p>
      </div>
      <button class="icon-btn" id="importClose" type="button" aria-label="关闭导入">×</button>
    </div>
    <div class="sheet-body" id="importBody"></div>
    <div class="sheet-foot" id="importFoot"></div>
  </div>
</div>

<div class="overlay" id="confirmOverlay" hidden>
  <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmBody">
    <h2 id="confirmTitle">确认</h2>
    <p id="confirmBody"></p>
    <div class="acts" id="confirmActs"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';

/* ---------------- helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = v => JSON.parse(JSON.stringify(v));
const HHMM = /^([01]\d|2[0-3]):[0-5]\d$/;

/* ---------------- business facts ---------------- */
const PROV = {
  glm:    { label: 'GLM',          auth: 'apikey', builtin: true,  quota: true,  call: true,  trigger: true,
            url: 'https://open.bigmodel.cn/api/paas/v4/chat/completions', model: 'glm-4.6',

const S = {

const acct = id => S.accounts.find(a => a.id === id) || null;
const cur = () => acct(S.sel);
const provOf = a => PROV[a.prov] || PROV.generic;

function mask(key) {
  if (!key) return '—';
  if (key.length <= 10) return key.slice(0, 3) + '…';
  return key.slice(0, 8) + '…' + key.slice(-4);
}
function statusOf(a) {
  if (!a.autoQueryEnabled) return ['warn', '自动查询关'];
  if (!a.last || a.last.status === 'idle') return ['', '未查询'];
  if (a.last.status === 'err') return ['err', '异常'];
  if (!provOf(a).quota) return ['', '仅监控'];
  return ['ok', '正常'];
}
const badge = (t, cls) => `<span class="badge ${cls || ''}">${esc(t)}</span>`;

/* ---------------- sidebar ---------------- */
function renderSidebar() {
  const q = S.search.trim().toLowerCase();
  const hits = S.accounts.filter(a => !q || (a.name + ' ' + provOf(a).label).toLowerCase().includes(q));
  const groups = [['apikey', 'API Key'], ['cli', '授权登录']];
  let html = '';
  groups.forEach(([kind, label]) => {
    const items = hits.filter(a => provOf(a).auth === kind);
    if (!items.length) return;
    html += `<div class="group-label"><span>${label}</span><span>${items.length}</span></div>`;
    items.forEach(a => {
      const [cls, word] = statusOf(a);
      const current = a.id === S.sel && S.panel === 'account';
      html += `<button class="acct" role="option" aria-selected="${current}" ${current ? 'aria-current="true"' : ''}
        data-act="select" data-id="${a.id}" title="${esc(a.name)} · ${esc(provOf(a).label)}">
        <span class="nm">${esc(a.name)}</span>
        <span class="st ${cls}"><span class="dot" aria-hidden="true"></span>${word}</span>
      </button>`;
    });
  });
  if (!html) html = `<div class="empty">没有匹配「${esc(S.search)}」的账号</div>`;
  $('#acctList').innerHTML = html;
  $('#acctCount').textContent = S.accounts.length + ' 个';
}

/* ---------------- detail head ---------------- */
function renderHead() {
  const title = $('#detailTitle'), sub = $('#detailSub'), acts = $('#detailActions'), tabs = $('#tabList');
  if (S.panel === 'templates') {
    title.textContent = '新建账号';
    sub.innerHTML = `<span>选择模板后在同一编辑区填写配置，不离开当前窗口。</span>`;
    acts.innerHTML = S.prevSel ? `<button class="btn" data-act="backAccount">取消</button>` : '';
    tabs.innerHTML = '';
    return;
  }
  if (S.panel === 'create') {
    const p = PROV[S.edit.prov];
    title.textContent = '新建账号';
    sub.innerHTML = `${badge(p.label)} ${badge('模板新建', 'lock')} <span>保存后加入左侧列表</span>`;
    acts.innerHTML = `<button class="btn" data-act="backTemplates">返回模板目录</button>`;
    tabs.innerHTML = '';
    return;
  }
  const a = cur();
  if (!a) { title.textContent = '—'; sub.innerHTML = ''; acts.innerHTML = ''; tabs.innerHTML = ''; return; }
  const p = provOf(a);
  title.textContent = a.name;
  sub.innerHTML = [
    badge(p.label),
    badge(AUTH_LABEL[p.auth], p.auth === 'cli' ? 'lock' : ''),
    badge(p.builtin ? '内置 · 地址锁定' : '自定义', p.builtin ? 'lock' : ''),
    !a.autoQueryEnabled ? badge('自动查询已关闭') : ''
  ].filter(Boolean).join(' ');
  acts.innerHTML = headActions(a, p);
  const dot = S.edit ? '<span class="unsaved" aria-label="有未保存的修改"></span>' : '';
  const tabDef = [['quota', '额度'], ['config', '配置'], ['trigger', '自动触发']];
  tabs.innerHTML = `<div role="tablist" style="display:flex;gap:4px">` + tabDef.map(([k, label]) =>
    `<button class="tab" role="tab" id="tab-${k}" aria-selected="${S.tab === k}" aria-controls="panel"
      data-act="tab" data-tab="${k}">${label}${k === 'config' || k === 'trigger' ? dot : ''}</button>`).join('') + `</div>`;
}
function headActions(a, p) {
  if (S.edit) return '';
  if (S.tab === 'quota') {
    if (p.quota) return `<button class="btn" data-act="query" data-id="${a.id}">查询额度</button>`;
    return `<button class="btn" data-act="check" data-id="${a.id}">检查凭证</button>` +
      (p.call ? ` <button class="btn" data-act="testCall" data-id="${a.id}">发送测试调用</button>` : '');
  }
  if (S.tab === 'config') {
    if (p.auth === 'cli') return `<span class="badge lock">只读 · 本机凭证</span>`;
    return `<button class="btn" data-act="edit" data-id="${a.id}">编辑</button>`;
  }
  if (S.tab === 'trigger') {
    return `<button class="btn" data-act="edit" data-id="${a.id}">编辑</button>`;
  }
  return '';
}

/* ---------------- panel dispatch ---------------- */
function renderPanel() {
  const panel = $('#panel');
  panel.setAttribute('aria-labelledby', S.tab ? 'tab-' + S.tab : '');
  if (S.panel === 'templates') { panel.innerHTML = viewTemplates(); return; }
  if (S.panel === 'create') { panel.innerHTML = formView(null, S.edit); return; }
  const a = cur();
  if (!a) { panel.innerHTML = `<div class="empty">左侧选择一个账号。</div>`; return; }
  const p = provOf(a);
  if (S.tab === 'quota') panel.innerHTML = viewQuota(a, p);
  else if (S.tab === 'config') {
    if (p.auth === 'cli') panel.innerHTML = viewCodexReadonly(a, p);
    else panel.innerHTML = S.edit ? formView(a, S.edit) : viewConfig(a, p);
  } else {
    panel.innerHTML = S.edit ? triggerForm(a, p, S.edit) : viewTrigger(a, p);
  }
  if (S.topErr) {
    const box = document.createElement('div');
    box.className = 'alert';
    box.setAttribute('role', 'alert');
    box.innerHTML = `<span><strong>无法保存：</strong>${esc(S.topErr)}</span>`;
    panel.insertBefore(box, panel.firstChild);
  }
}

/* ---------------- quota ---------------- */
function quotaCard(label, q, reset) {
  if (!q) return `<div class="quota"><div class="lbl">${label}</div><div class="num">—</div><div class="meta">此供应商未提供该窗口额度</div></div>`;
  const pct = q.limit ? Math.max(0, Math.min(100, Math.round(q.used / q.limit * 100))) : 0;
  return `<div class="quota">
    <div class="lbl"><span>${label}</span><span>${pct}%</span></div>
    <div class="num">${q.used}<small> / ${q.limit} 次</small></div>
    <div class="bar" role="progressbar" aria-label="${label}额度已用百分比" aria-valuemin="0" aria-valuemax="100"
      aria-valuenow="${pct}" title="${label}：已用 ${q.used} / ${q.limit} 次（${pct}%）"><span style="width:${pct}%"></span></div>
    <div class="meta">剩余 ${q.limit - q.used} · ${reset}</div>
  </div>`;
}
function demoQuota(prov) {
  const q = { h5: { used: 12, limit: 100 }, week: { used: 30, limit: 300 } };
  if (['glm', 'ollama', 'ocgo'].includes(prov)) q.month = { used: 60, limit: 1000 };
  return q;
}
function bumpQuota(q) {
  const next = { h5: { used: q.h5.used + 3, limit: q.h5.limit }, week: { used: q.week.used + 5, limit: q.week.limit } };
  if (q.month) next.month = { used: q.month.used + 5, limit: q.month.limit };
  return next;
}
function resultBox(last) {
  if (!last) return '';
  if (last.status === 'err') {
    return `<div class="result err"><span class="st err"><span class="dot"></span></span>
      <span><strong>查询失败</strong> · ${esc(last.at)} · ${esc(last.msg)}</span></div>`;
  }
  if (last.status === 'idle') return '';
  return `<div class="result ok"><span class="st ok"><span class="dot"></span></span>
    <span><strong>最近查询成功</strong> · ${esc(last.at)} · 耗时 ${last.ms} ms · ${esc(last.msg)}</span></div>`;
}

function scanTable(im) {
  const rows = im.rows;

  const trs = rows.map((r, i) => {
    const pickable = r.state === 'ok' || r.state === 'unadapted' || r.state === 'fail';

    const cls = copied ? 'done' : '';
    return `<tr class="${cls}">
      <td class="ck"><input type="checkbox" data-pick="${i}" ${copied ? 'disabled' : ''}
        ${pickable && !copied ? '' : 'disabled'} ${im.picked && im.picked.has(i) && !copied ? 'checked' : ''}

}
function importFoot(im) {
  const rows = im.rows;
  const pickable = rows.map((r, i) => i).filter(i => (rows[i].state === 'ok' || rows[i].state === 'unadapted' || rows[i].state === 'fail') &&
    !(im.result && im.result.done.includes(i)));
  const allChecked = pickable.length && pickable.every(i => im.picked && im.picked.has(i));
  return `<div class="status">${im.result ? '已执行导入（模拟）' : `${(im.picked || new Set()).size} 项已勾选`}</div>
    <button class="btn ghost" type="button" data-act="toggleAll" ${pickable.length ? '' : 'disabled'}>${allChecked ? '取消全选' : '全选可导入'}</button>
    <button class="btn" data-act="importCancel">关闭</button>
    <button class="btn primary" data-act="doImport" ${pickable.length ? '' : 'disabled'}>${im.result ? (im.result.failed.length ? '重试失败项' : '已全部导入') : '导入所选'}</button>`;

function doImport() {
  const im = S.imp, rows = im.rows;
  const chosen = Array.from(im.picked || new Set()).filter(i => {
    const r = rows[i];
    return (r.state === 'ok' || r.state === 'unadapted' || r.state === 'fail') && !(im.result && im.result.done.includes(i));
  });
  if (!chosen.length) { toast('请先勾选要导入的行', true); return; }
  const done = im.result ? im.result.done.slice() : [];
  const failed = [];
  const firstPass = !im.result;
  chosen.forEach(i => {
    const r = rows[i];
    if (r.state === 'fail' && firstPass) { failed.push(i); return; }
    if (S.accounts.some(a => a.name === r.name && a.prov === r.prov)) return; // never copy twice
    if (r.state === 'fail') { r.state = 'ok'; r.why = '重试成功'; }
    S.accounts.push({
      id: 'imp-' + r.prov + '-' + i + '-' + S.accounts.length,
      name: r.name, prov: r.prov, key: r.key, model: (PROV[r.prov] || {}).model || '',
      prompt: (PROV[r.prov] || {}).prompt || '', url: (PROV[r.prov] || {}).url,
      protocol: (PROV[r.prov] || {}).protocol || 'openai',
      times: [], autoQueryEnabled: !!PROV[r.prov].quota, autoTriggerEnabled: false, quota: null,
      last: { status: 'idle', at: '尚未查询', ms: 0, msg: '导入完成，等待首次查询' }
    });
    done.push(i);
  });
  im.result = { done, failed };
  im.picked = new Set(failed);
  renderAll();
  renderImport();
  toast(failed.length ? `已导入 ${done.length} 个，${failed.length} 个失败可重试` : `已导入 ${done.length} 个账号`, !!failed.length);
}

/* ---------------- validation ---------------- */
function validUrl(u) {
  if (/[\s\x00-\x1f\x7f]/.test(u)) return false; // URL 解析器会静默剥离制表/换行
  try {
    const x = new URL(u);
    return (x.protocol === 'http:' || x.protocol === 'https:') && !!x.hostname &&
      !/[%\s]/.test(x.hostname);
  } catch (e) { return false; }
}
function validateConfig(edit) {
  const e = {}, v = edit.v, p = PROV[edit.prov];
  if (!v.name.trim()) e.name = '账号名称不能为空';
  if (p.auth !== 'cli') {
    if (!v.key.trim()) e.key = 'API Key 不能为空';
    if (!p.builtin) {
      const u = v.url.trim();
      if (!u) e.url = '查询地址不能为空';
      else if (!validUrl(u)) e.url = '地址必须是有效的 http(s) URL（含主机名）';
    }
  }
  if (p.protocol && !['openai', 'anthropic'].includes(v.protocol)) e.protocol = '请选择调用协议';
  return e;
}
function canTrigger(p) { return !!p.call; }
function validateTrigger(edit) {
  const e = {}, p = PROV[edit.prov], pending = (edit.timeInput || '').trim();
  if (!canTrigger(p)) return e;
  if (pending && !HHMM.test(pending)) e.time = '时间必须是严格 HH:MM，例如 09:00；9:00 不合法';
  else if (pending && edit.times.includes(pending)) e.time = '此时间点已存在，请勿重复添加';
  if (edit.times.some(t => !HHMM.test(t))) e.times = '已有时间点格式错误，请移除后重填';
  if (new Set(edit.times).size !== edit.times.length) e.times = '时间点不可重复';
  if (edit.v.autoTriggerEnabled && edit.times.length === 0 && !pending) e.times = '开启模型定时调用时至少需要一个时间点';
  return e;
}

  };
  S.errs = {}; S.topErr = '';
  S.panel = 'create';
  renderAll();
  setTimeout(() => { const n = $('#f-name'); if (n) { n.focus(); n.select(); } }, 0);
}
function save() {
  if (!S.edit) return;
  const configErrs = validateConfig(S.edit);
  const triggerErrs = validateTrigger(S.edit);
  S.errs = Object.assign({}, configErrs, triggerErrs);
  S.topErr = Object.values(S.errs).join('；');
  if (Object.keys(S.errs).length) {
    if (!S.edit.isNew) S.tab = Object.keys(configErrs).length ? 'config' : 'trigger';
    renderAll(); focusFirstErr(); return;
  }
  const ed = S.edit, v = ed.v;
  if (canTrigger(PROV[ed.prov]) && (ed.timeInput || '').trim()) { ed.times.push(ed.timeInput.trim()); ed.times.sort(); ed.timeInput = ''; }
  if (ed.isNew) {
    const a = {
      id: 'new-' + Date.now().toString(36), name: v.name.trim(), prov: ed.prov,
      key: v.key.trim(), model: v.model.trim(), prompt: v.prompt, url: v.url,
      protocol: v.protocol || PROV[ed.prov].protocol || 'openai',
      times: ed.times.slice(), autoQueryEnabled: !!v.autoQueryEnabled,
      autoTriggerEnabled: canTrigger(PROV[ed.prov]) && !!v.autoTriggerEnabled, quota: null,
      last: { status: 'idle', at: '尚未查询', ms: 0, msg: '账号已创建，等待首次查询' }
    };
    S.accounts.push(a);
    S.sel = S.prevSel = a.id; S.panel = 'account'; S.tab = 'quota';
    S.edit = null; S.errs = {}; S.topErr = '';
    renderAll(); toast('已创建账号：' + a.name);
    return;
  }
  const a = acct(ed.id);
  if (!a) { S.edit = null; renderAll(); return; }
  a.name = v.name.trim(); a.key = v.key.trim(); a.url = v.url;
  a.model = v.model.trim(); a.prompt = v.prompt; a.protocol = v.protocol;
  a.times = ed.times.slice(); a.autoQueryEnabled = !!v.autoQueryEnabled;
  a.autoTriggerEnabled = canTrigger(provOf(a)) && !!v.autoTriggerEnabled;
  if (!provOf(a).quota) a.quota = null;
  S.edit = null; S.errs = {}; S.topErr = '';
  renderAll(); toast('已保存：' + a.name);
}
function focusFirstErr() {
  const el = $('#panel [aria-invalid="true"]');
  if (el) { el.focus(); return; }
  const n = $('#panel .err'); if (n) n.scrollIntoView({ block: 'nearest' });
}
function doQuery(id) {
  const a = acct(id); if (!a) return;
  const p = provOf(a);
  if (!p.quota) { toast('该账号的额度查询尚未适配', true); return; }
  S.q[id] = { status: 'running' };
  renderPanel(); renderHead(); renderSidebar();
  setTimeout(() => {
    if (!acct(id)) return;
    const ok = a.prov !== 'ocgo'; // demo: ocgo always fails -> distinct error path
    if (ok) {
      const base = a.quota ? bumpQuota(a.quota) : demoQuota(a.prov);
      a.quota = base;
      a.last = { status: 'ok', at: '刚刚', ms: 320 + Math.floor(Math.random() * 300),
                 msg: `查询成功：5h 剩余 ${a.quota.h5.limit - a.quota.h5.used} 次` };
      toast('额度已更新');
    } else {
      a.last = { status: 'err', at: '刚刚', ms: 5000, msg: '查询失败：401 凭证无效（演示，不会显示为成功）' };
      toast('查询失败：401 凭证无效', true);
    }
    delete S.q[id];
    renderAll();
  }, 1100);
}
function doCheck(id) {
  const a = acct(id); if (!a) return;
  S.q[id] = { status: 'running' };
  renderPanel(); renderHead();
  setTimeout(() => {
    if (!acct(id)) return;
    a.last = { status: 'ok', at: '刚刚', ms: 0, msg: '检查完成（模拟）：凭证来源可用，未读取真实文件' };
    delete S.q[id]; renderAll(); toast('凭证检查完成（模拟）');
  }, 700);
}
function deleteAccount(id) {
  const a = acct(id); if (!a) return;
  askConfirm({
    title: '删除账号？', body: `将从当前演示列表中移除「${a.name}」，此操作仅影响内存数据。`,
    ok: '删除', danger: true,
    onOk: () => {
      S.accounts = S.accounts.filter(x => x.id !== id);
      closeConfirm();
      if (S.sel === id) S.sel = S.accounts.length ? S.accounts[0].id : null;
      S.edit = null; S.errs = {}; S.topErr = ''; S.panel = 'account'; S.tab = 'quota';
      renderAll(); toast('已删除（仅内存）');
    }
  });
}
function testCall(p, onDone) {
  if (!p) return;
  if (!canTrigger(p)) { toast('当前供应商未适配调用协议，无法发送测试调用', true); return; }
  askConfirm({
    title: '发送一次测试调用？',
    body: `将消耗 ${p.label} 的额度，使用 ${p.protocol === 'anthropic' ? 'Anthropic Messages' : 'OpenAI chat/completions'}；调用结果不代表 5h 窗口会重置。演示环境不会联网，仅模拟结果。`,
    ok: '发送测试',
    onOk: () => {
      closeConfirm();
      toast('测试调用已发送（模拟）…');
      setTimeout(() => {
        if (onDone) onDone();
        toast('测试调用成功（模拟）：收到 OK', false);
      }, 900);
    }
  });
}
/* ---------------- event handlers ---------------- */
function renderAll() {
  renderSidebar(); renderHead(); renderPanel();
}
function clearDraft() { S.edit = null; S.errs = {}; S.topErr = ''; }
function selectAccount(id) {
  if (!acct(id)) return;
  leaveGuard(() => {
    clearDraft(); S.sel = S.prevSel = id; S.panel = 'account'; S.tab = 'quota';
    renderAll(); $('#panel').scrollTop = 0;
  });
}
function cancelEdit() {
  leaveGuard(() => {
    const wasNew = S.edit && S.edit.isNew;
    clearDraft();
    if (S.panel === 'create' || wasNew) S.panel = 'templates';
    renderAll(); toast('草稿已取消');
  });
}
function addTime() {
  const ed = S.edit; if (!ed) return;
  const t = (ed.timeInput || '').trim();
  let error = '';
  if (!HHMM.test(t)) error = '请使用严格的 HH:MM 格式，例如 09:00；9:00 不合法';
  else if (ed.times.includes(t)) error = '此时间点已存在，请勿重复添加';
  if (error) {
    S.errs.time = error; S.topErr = error;
    renderAll(); const n = $('#f-time'); if (n) n.focus(); return;
  }
  ed.times.push(t); ed.times.sort(); ed.timeInput = ''; ed.dirty = true;
  delete S.errs.time; delete S.errs.times; S.topErr = '';
  renderAll(); toast('已加入草稿：' + t);
}
function scanImport() {
  const im = S.imp; if (!im || im.scanning) return;
  im.scanning = true;
  $('#importBody').innerHTML = `<div class="result" role="status">正在扫描模拟配置…不会读取真实文件。</div>`;
  $('#importFoot').innerHTML = `<span class="status">扫描中…</span><button class="btn" data-act="importCancel">取消</button>`;
  setTimeout(() => {
    if (S.imp !== im) return;
    im.scanning = false;
    im.rows = clone(IMPORT_ROWS[im.src]).map(r => {
      if (r.state !== 'oauth' && S.accounts.some(a => a.prov === r.prov && (a.name === r.name || (r.key && a.key === r.key)))) {
        r.state = 'exists'; r.why = '已存在，默认跳过';
      }
      return r;
    });
    im.picked = new Set(im.rows.map((r, i) => ({r, i})).filter(x => ['ok','unadapted','fail'].includes(x.r.state)).map(x => x.i));
    im.result = null; renderImport();
  }, 650);
}
function setField(target) {
  if (!S.edit) return;
  const key = target.dataset.f || target.dataset.f2;
  if (!key) return;
  if (key === 'time') S.edit.timeInput = target.value;
  else S.edit.v[key] = target.type === 'checkbox' ? target.checked : target.value;
  S.edit.dirty = true;
  // Do not rebuild the form while typing; the cursor and selection stay intact.
  if (target.dataset.f && S.errs[key]) {
    delete S.errs[key]; target.removeAttribute('aria-invalid');
    const err = $(`[data-err="${key}"]`); if (err) err.textContent = '';
  }
}

document.addEventListener('input', ev => {
  if (ev.target === $('#searchInput')) {
    S.search = ev.target.value; $('#searchClear').hidden = !S.search; renderSidebar(); return;
  }
  if (ev.target.matches('[data-f],[data-f2]')) setField(ev.target);
});
document.addEventListener('change', ev => {
  if (ev.target.matches('[data-f],[data-f2]')) setField(ev.target);
  if (ev.target.matches('[data-pick]') && S.imp) {
    const i = Number(ev.target.dataset.pick);
    if (ev.target.checked) S.imp.picked.add(i); else S.imp.picked.delete(i);
    $('#importFoot').innerHTML = importFoot(S.imp);
  }
});
$('#searchClear').addEventListener('click', () => {
  S.search = ''; $('#searchInput').value = ''; $('#searchClear').hidden = true; renderSidebar(); $('#searchInput').focus();
});
$('#btnNew').addEventListener('click', () => leaveGuard(() => {
  clearDraft(); S.prevSel = S.sel; S.panel = 'templates'; renderAll(); $('#panel').scrollTop = 0;
}));
$('#btnImport').addEventListener('click', openImport);
$('#importClose').addEventListener('click', closeImport);

document.addEventListener('click', ev => {
  const src = ev.target.closest('[data-src]');
  if (src && S.imp && !S.imp.scanning) {
    S.imp.src = src.dataset.src; S.imp.rows = null; S.imp.result = null; renderImport(); return;
  }
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const action = b.dataset.act, id = b.dataset.id;
  switch(action) {
    case 'select': selectAccount(id); break;
    case 'tab':
      S.tab = b.dataset.tab; renderAll(); $('#panel').scrollTop = 0;
      { const tab = $('#tab-' + S.tab); if (tab) tab.focus(); }
      break;
    case 'edit': startEdit(id); break;
    case 'save': save(); break;
    case 'cancelEdit': cancelEdit(); break;
    case 'backAccount':
      leaveGuard(() => { clearDraft(); S.panel = 'account'; S.sel = S.prevSel; renderAll(); }); break;
    case 'backTemplates':
      leaveGuard(() => { clearDraft(); S.panel = 'templates'; renderAll(); }); break;
    case 'pickTpl': startCreate(b.dataset.prov); break;
    case 'delete': deleteAccount(id); break;
    case 'query': doQuery(id); break;
    case 'check': doCheck(id); break;
    case 'reveal': {
      const input = $('#f-key'); if (!input) break;
      const show = input.type === 'password'; input.type = show ? 'text' : 'password';
      b.textContent = show ? '隐藏' : '显示'; b.setAttribute('aria-pressed', String(show)); break;
    }
    case 'replaceKey': {
      if (!S.edit) break; S.edit.v.key = ''; S.edit.dirty = true;
      const input = $('#f-key'); if (input) { input.value = ''; input.focus(); }
      toast('请输入新的演示 API Key，保存后替换'); break;
    }
    case 'addTime': addTime(); break;
    case 'rmDraftTime': {
      const removed = S.edit.times.splice(Number(b.dataset.i), 1)[0]; S.edit.dirty = true;
      renderAll(); toast('已从草稿移除 ' + removed); break;
    }
    case 'testCall': { const a = acct(id); if (a) testCall(provOf(a)); break; }
    case 'testCallDraft': if (S.edit) testCall(PROV[S.edit.prov]); break;
    case 'scan': scanImport(); break;
    case 'doImport': doImport(); break;
    case 'importCancel': closeImport(); break;
    case 'toggleAll': {
      const im = S.imp; if (!im || !im.rows) break;
      const candidates = im.rows.map((r,i) => ({r,i})).filter(x => ['ok','unadapted','fail'].includes(x.r.state) && !(im.result && im.result.done.includes(x.i))).map(x => x.i);
      const all = candidates.every(i => im.picked.has(i));
      candidates.forEach(i => { if (all) im.picked.delete(i); else im.picked.add(i); });
      renderImport(); break;
    }
    case 'confirmNo': closeConfirm(); break;
    case 'confirmYes': {
      const cb = confirmState && confirmState.onOk; if (cb) cb(); break;
    }
  }
});

// Dialogs keep focus inside and restore the element which opened them.
let focusBeforeOverlay = null;
const modalObserver = new MutationObserver(() => {
  const any = !$('#confirmOverlay').hidden || !$('#importOverlay').hidden;
  if (any && !focusBeforeOverlay) focusBeforeOverlay = document.activeElement;
  if (!any && focusBeforeOverlay) {
    if (focusBeforeOverlay.isConnected) focusBeforeOverlay.focus();
    else $('#btnNew').focus();
    focusBeforeOverlay = null;
  }
});
modalObserver.observe($('#confirmOverlay'), { attributes: true, attributeFilter: ['hidden'] });
modalObserver.observe($('#importOverlay'), { attributes: true, attributeFilter: ['hidden'] });

document.addEventListener('keydown', ev => {
  const confirmOpen = !$('#confirmOverlay').hidden;
  const importOpen = !$('#importOverlay').hidden;
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 's') {
    ev.preventDefault(); if (!confirmOpen && !importOpen && S.edit) save(); else if (!confirmOpen && !importOpen) toast('当前没有待保存的草稿'); return;
  }
  if (ev.key === 'Escape') {
    ev.preventDefault();
    if (confirmOpen) closeConfirm();
    else if (importOpen) closeImport();
    else if (S.edit) cancelEdit();
    else if (S.panel === 'templates') { S.panel = 'account'; S.sel = S.prevSel; renderAll(); }
    else toast('当前没有打开的弹层');
    return;
  }
  if (ev.key === 'Tab' && (confirmOpen || importOpen)) {
    const overlay = confirmOpen ? $('#confirmOverlay') : $('#importOverlay');
    const focusable = $$('button:not([disabled]),input:not([disabled]),[tabindex="0"]', overlay).filter(el => !el.closest('[hidden]'));
    if (!focusable.length) { ev.preventDefault(); return; }
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (ev.shiftKey && (document.activeElement === first || !overlay.contains(document.activeElement))) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && (document.activeElement === last || !overlay.contains(document.activeElement))) { ev.preventDefault(); first.focus(); }
  }
  if (ev.target.matches('.tab') && ['ArrowLeft','ArrowRight','Home','End'].includes(ev.key)) {
    ev.preventDefault(); const keys = ['quota','config','trigger']; let i = keys.indexOf(S.tab);
    if (ev.key === 'Home') i = 0; else if (ev.key === 'End') i = 2;
    else i = (i + (ev.key === 'ArrowRight' ? 1 : -1) + 3) % 3;
    S.tab = keys[i]; renderAll(); $('#tab-' + S.tab).focus();
  }
  if (ev.target.id === 'f-time' && ev.key === 'Enter') { ev.preventDefault(); addTime(); }
});
renderAll();

})();
</script>
</body>
</html>
