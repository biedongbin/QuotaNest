<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440, height=900">
<title>$brand — demo</title>
<script src="vendor/gsap.min.js"></script>
<style>
@font-face { font-family: "QuotaNest Sans"; src: local("Arial"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1440px; height: 900px; overflow: hidden; background: #0b111e; }
body { color: #f0f5ff; font-family: "QuotaNest Sans", sans-serif; -webkit-font-smoothing: antialiased; }
#root { position: relative; width: 1440px; height: 900px; overflow: hidden; background: radial-gradient(ellipse at 12% 0%, #182d43 0%, transparent 54%), radial-gradient(ellipse at 95% 100%, #203039 0%, transparent 55%), #0b111e; }
.brand { position: absolute; left: 44px; top: 23px; display: flex; align-items: center; gap: 11px; font-size: 19px; font-weight: 650; letter-spacing: .1px; }
.brand img { width: 42px; height: 42px; }
.fixture { position: absolute; top: 37px; right: 46px; font-size: 15px; color: #9eafc6; }
.scene { position: absolute; inset: 0; opacity: 0; }
.scene h1 { position: absolute; left: 46px; top: 87px; font-size: 39px; line-height: 1.2; font-weight: 700; letter-spacing: -.8px; }
.scene .subtitle { position: absolute; left: 46px; top: 141px; font-size: 23px; color: #a9c8e0; }
.scene .visual { position: absolute; left: 40px; top: 196px; width: 1360px; height: 588px; display: flex; justify-content: center; align-items: center; }
.screen { display: block; max-width: 1320px; max-height: 588px; object-fit: contain; border-radius: 12px; filter: drop-shadow(0 18px 26px #0008); }
.scene .note { position: absolute; left: 46px; bottom: 62px; font-size: 20px; color: #b4c1d6; }
.scene .label { position: absolute; left: 46px; bottom: 27px; font-size: 14px; font-weight: 650; letter-spacing: 1.4px; color: #80b9c7; }
.scene .count { position: absolute; right: 46px; bottom: 26px; font-size: 15px; color: #8fa3be; }
.hud-grid { display: grid; grid-template-columns: 320px 320px 500px; grid-template-rows: 260px 300px; gap: 24px; align-items: center; }
.hud-shot { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; opacity: .62; }
.hud-0 { grid-column: 1; grid-row: 1 / 3; }
.hud-1 { grid-column: 2; grid-row: 1 / 3; }
.hud-2 { grid-column: 3; grid-row: 1; }
.hud-3 { grid-column: 3; grid-row: 2; }
.hud-shot img { display: block; width: 100%; max-height: 510px; object-fit: contain; border-radius: 9px; filter: drop-shadow(0 18px 28px #0009); }
.hud-0 img, .hud-1 img { width: 306px; }
.hud-2 img { width: 470px; }
.hud-3 img { width: 410px; }
.hud-style { font-size: 18px; letter-spacing: 2px; color: #b8e4dc; }
.progress { position: absolute; bottom: 0; left: 0; width: 1440px; height: 3px; background: #7ed8b8; transform-origin: left center; }
</style>
</head>
<body>
<div id="root" data-composition-id="quotanest-$lang" data-start="0" data-duration="27" data-fps="30" data-width="1440" data-height="900">
<div class="brand"><img src="assets/app-icon.png" alt=""><span>$brand</span></div>
<div class="fixture">$fixture</div>
$scenes
<div class="progress"></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
$tweens
tl.fromTo('.progress', { scaleX: 0 }, { scaleX: 1, duration: 27, ease: 'none' }, 0);
tl.seek(0);
window.__timelines = window.__timelines || {};
window.__timelines['quotanest-$lang'] = tl;
</script>
</body>
</html>
